<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Visor de Base de Datos SQLite - Fast Order Cúcuta</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg">
        <i class="fa-solid fa-database"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-extrabold text-base text-white">Visor de Base de Datos Relacional SQLite</h1>
          <span class="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-mono text-[10px] font-bold">db/fastorder.sqlite</span>
        </div>
        <p class="text-xs text-slate-400">Consulta directa sobre las tablas SQL del servidor en tiempo real</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="cargarTablasSQLite()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-rotate"></i> Actualizar Datos
      </button>
      <a href="admin.html" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-arrow-left"></i> Volver a Admin
      </a>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-6 py-6 space-y-5 flex-1">
    <!-- Selector de Tabla SQL y Filtro de Negocio -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2" id="table-tabs">
        <button onclick="seleccionarTabla('negocios')" data-table="negocios" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition flex items-center gap-1.5">
          <i class="fa-solid fa-store"></i> Tabla: negocios <span id="cnt-negocios" class="px-1.5 py-0.2 rounded bg-slate-950/50 font-mono text-[10px]">0</span>
        </button>
        <button onclick="seleccionarTabla('productos')" data-table="productos" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-burger"></i> Tabla: productos <span id="cnt-productos" class="px-1.5 py-0.2 rounded bg-slate-950/50 font-mono text-[10px]">0</span>
        </button>
        <button onclick="seleccionarTabla('insumos')" data-table="insumos" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-boxes-stacked"></i> Tabla: insumos <span id="cnt-insumos" class="px-1.5 py-0.2 rounded bg-slate-950/50 font-mono text-[10px]">0</span>
        </button>
        <button onclick="seleccionarTabla('pedidos')" data-table="pedidos" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-receipt"></i> Tabla: pedidos <span id="cnt-pedidos" class="px-1.5 py-0.2 rounded bg-slate-950/50 font-mono text-[10px]">0</span>
        </button>
        <button onclick="seleccionarTabla('movimientos_inventario')" data-table="movimientos_inventario" class="tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left"></i> Tabla: movimientos_inventario <span id="cnt-movimientos_inventario" class="px-1.5 py-0.2 rounded bg-slate-950/50 font-mono text-[10px]">0</span>
        </button>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-400 font-semibold">Filtrar por negocio:</span>
        <select id="filter-negocio" onchange="renderTablaActiva()" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-white font-mono focus:outline-none focus:border-blue-500">
          <option value="all">Todos los negocios</option>
        </select>
      </div>
    </div>

    <!-- Sentencia SQL Ejecutada -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-2.5 flex items-center justify-between font-mono text-xs">
      <div class="text-emerald-400">
        <span class="text-slate-500 mr-2">SQL&gt;</span>
        <span id="sql-query-label">SELECT * FROM negocios;</span>
      </div>
      <span class="text-slate-400" id="rows-count-label">0 filas</span>
    </div>

    <!-- Tabla de Resultados -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto max-h-[68vh]">
        <table class="w-full text-left text-xs">
          <thead id="table-head" class="bg-slate-950 text-slate-400 uppercase font-mono border-b border-slate-800 sticky top-0"></thead>
          <tbody id="table-body" class="divide-y divide-slate-800/80 font-mono text-[11px] text-slate-200"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let datosSQLite = {};
    let tablaActiva = 'negocios';

    async function cargarTablasSQLite() {
      try {
        const resp = await fetch('/api/admin/sqlite-tables');
        const data = await resp.json();
        if (!data || !data.ok) return;
        datosSQLite = data.tablas || {};

        Object.keys(datosSQLite).forEach(t => {
          const el = document.getElementById(`cnt-${t}`);
          if (el) el.innerText = (datosSQLite[t] || []).length;
        });

        const selectNeg = document.getElementById('filter-negocio');
        const actual = selectNeg.value;
        const negocios = datosSQLite.negocios || [];
        selectNeg.innerHTML = `<option value="all">Todos los negocios</option>` +
          negocios.map(n => `<option value="${n.id}">${n.id} — ${n.nombre}</option>`).join('');
        if ([...selectNeg.options].some(o => o.value === actual)) {
          selectNeg.value = actual;
        }

        renderTablaActiva();
      } catch (e) {
        console.error(e);
      }
    }

    function seleccionarTabla(nombre) {
      tablaActiva = nombre;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.getAttribute('data-table') === nombre) {
          btn.className = 'tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white transition flex items-center gap-1.5';
        } else {
          btn.className = 'tab-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5';
        }
      });
      renderTablaActiva();
    }

    function renderTablaActiva() {
      const filasOriginales = datosSQLite[tablaActiva] || [];
      const filtroNeg = document.getElementById('filter-negocio').value;

      const filas = filasOriginales.filter(row => {
        if (filtroNeg === 'all') return true;
        if (tablaActiva === 'negocios') return row.id === filtroNeg;
        if ('negocio_id' in row) return row.negocio_id === filtroNeg;
        return true;
      });

      const whereSql = filtroNeg === 'all'
        ? ''
        : (tablaActiva === 'negocios' ? ` WHERE id = '${filtroNeg}'` : ` WHERE negocio_id = '${filtroNeg}'`);
      document.getElementById('sql-query-label').innerText = `SELECT * FROM ${tablaActiva}${whereSql};`;
      document.getElementById('rows-count-label').innerText = `${filas.length} registro(s)`;

      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      if (filas.length === 0) {
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td class="p-8 text-center text-slate-500 font-sans">No hay registros en esta tabla para el filtro seleccionado.</td></tr>`;
        return;
      }

      const columnas = Object.keys(filas[0]);
      thead.innerHTML = `<tr>${columnas.map(c => `<th class="py-3 px-3.5 whitespace-nowrap">${c}</th>`).join('')}</tr>`;

      tbody.innerHTML = filas.map(row => `
        <tr class="hover:bg-slate-800/50 transition">
          ${columnas.map(col => {
            const val = row[col];
            const str = val === null || val === undefined ? '<span class="text-slate-600">NULL</span>' : String(val);
            const trunc = str.length > 90 ? str.slice(0, 90) + '…' : str;
            return `<td class="py-2.5 px-3.5 whitespace-nowrap max-w-xs truncate" title="${String(val || '').replace(/"/g, '&quot;')}">${trunc}</td>`;
          }).join('')}
        </tr>
      `).join('');
    }

    cargarTablasSQLite();
  </script>
</body>
</html>
